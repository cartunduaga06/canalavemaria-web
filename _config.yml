lang: es
title: Ave María TV
description: Canal católico de fe y oración.
url: https://canalavemaria.com
baseurl: ""
permalink: /videos/:year/:month/:day/:title/
collections:
  drafts:
    output: false
  santos:
    output: true
    permalink: /santos/:name/
defaults:
  - scope:
      path: ""
      type: santos
    values:
      layout: santo
plugins:
  - jekyll-feed
  - jekyll-sitemap
exclude:
  - scripts
  - README.md
  - Gemfile
  - Gemfile.lock
  - AGENTS.md
  - docs
  - rosario-app
  - reference
  - node_modules
  - package.json
  - package-lock.json

  - vendor
